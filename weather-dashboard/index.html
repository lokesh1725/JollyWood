<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherSky | Premium Weather Dashboard</title>
    <meta name="description" content="A beautiful and interactive weather dashboard with real-time data.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
    <div id="app">
        <header>
            <div class="logo">WeatherSky</div>
            <div class="search-container">
                <input type="text" id="city-input" placeholder="Search for a city..." autocomplete="off">
                <button id="search-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
            </div>
        </header>

        <main>
            <div id="error-message" class="hidden"></div>
            
            <section id="current-weather" class="glass-card">
                <div class="weather-info">
                    <div class="location">
                        <h1 id="city-name">London, UK</h1>
                        <p id="current-date">Thursday, 28 May</p>
                    </div>
                    <div class="temp-display">
                        <span id="temperature">24°</span>
                        <img id="weather-icon" src="https://openweathermap.org/img/wn/01d@4x.png" alt="weather icon">
                    </div>
                    <div class="weather-desc" id="weather-description">Clear Sky</div>
                </div>
                
                <div class="weather-details">
                    <div class="detail-item">
                        <span class="label">Humidity</span>
                        <span class="value" id="humidity">45%</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Wind Speed</span>
                        <span class="value" id="wind-speed">12 km/h</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Pressure</span>
                        <span class="value" id="pressure">1012 hPa</span>
                    </div>
                </div>
            </section>

            <section id="forecast">
                <h2>5-Day Forecast</h2>
                <div class="forecast-container" id="forecast-items">
                    <!-- Forecast items will be injected here -->
                    <div class="forecast-item glass-card">
                        <span class="day">Fri</span>
                        <img src="https://openweathermap.org/img/wn/02d@2x.png" alt="weather">
                        <span class="temp">22°</span>
                    </div>
                    <div class="forecast-item glass-card">
                        <span class="day">Sat</span>
                        <img src="https://openweathermap.org/img/wn/03d@2x.png" alt="weather">
                        <span class="temp">20°</span>
                    </div>
                    <div class="forecast-item glass-card">
                        <span class="day">Sun</span>
                        <img src="https://openweathermap.org/img/wn/04d@2x.png" alt="weather">
                        <span class="temp">19°</span>
                    </div>
                    <div class="forecast-item glass-card">
                        <span class="day">Mon</span>
                        <img src="https://openweathermap.org/img/wn/09d@2x.png" alt="weather">
                        <span class="temp">18°</span>
                    </div>
                    <div class="forecast-item glass-card">
                        <span class="day">Tue</span>
                        <img src="https://openweathermap.org/img/wn/10d@2x.png" alt="weather">
                        <span class="temp">17°</span>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 WeatherSky. Powered by OpenWeatherMap.</p>
            <p>Developed by Lokeshwaran</p>
        </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
